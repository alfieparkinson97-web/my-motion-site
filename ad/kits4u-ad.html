<style>
:root { --bg: #05070a; --volt: #c9f24a; --ink: #fff; }
* { box-sizing: border-box }
html, body { margin: 0; height: 100%; background: #000; overflow: hidden }
#fit { position: absolute; left: 50%; top: 50%; width: 1080px; height: 1920px; transform-origin: 50% 50%; transform: translate(-50%, -50%) }
#stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); color: var(--ink);
  font-family: 'Hanken Grotesk', system-ui, sans-serif; -webkit-font-smoothing: antialiased }
#cam { position: absolute; inset: 0; transform-origin: 500px 900px }
#gl { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; display: block }
.layer { position: absolute; inset: 0; display: none }
.fx { position: absolute; inset: 0; pointer-events: none; opacity: 0 }
#dim { background: radial-gradient(120% 70% at 50% 40%, rgba(5,7,10,.2), rgba(5,7,10,.85)); }
#black { background: #000; opacity: 1 }
#flashW { background: #fff }
#flashV { background: var(--volt) }
#flashT { mix-blend-mode: screen }
#vig { opacity: 1; background: radial-gradient(130% 90% at 50% 45%, transparent 55%, rgba(0,0,0,.55)) }

/* type */
.serif { font-family: 'Prata', Georgia, serif; font-weight: 400 }
.stack { position: absolute; left: 60px; width: 880px; display: flex; flex-direction: column; align-items: center }
.ln { display: block; white-space: nowrap; line-height: 1.04; text-align: center; will-change: transform, opacity, filter }
.mask { display: block; overflow: hidden; padding: .02em .1em .14em; margin-bottom: -.1em; text-align: center; white-space: nowrap }
.mask > span { display: inline-block; line-height: 1.04 }
.volt { color: var(--volt) }
.glow { filter: drop-shadow(0 0 26px rgba(201,242,74,.55)) }
.shadow { text-shadow: 0 8px 40px rgba(0,0,0,.65) }

/* scene 2 */
#s2count { position: absolute; left: 60px; width: 880px; top: 196px; text-align: center; font-weight: 800; font-size: 46px; letter-spacing: .32em; color: var(--volt); padding-left: .32em }
#s2box { position: absolute; left: 60px; width: 880px; top: 270px; height: 330px; display: flex; align-items: center; justify-content: center }
#s2name, #s2ghost { position: absolute; white-space: nowrap; line-height: 1 }
#s2ghost { color: transparent; -webkit-text-stroke: 3px rgba(255,255,255,.55) }
#s2bar { position: absolute; left: 500px; top: 616px; height: 12px; width: 0; margin-left: 0; background: var(--volt); border-radius: 6px; box-shadow: 0 0 30px rgba(201,242,74,.7) }

/* scene 3: jersey grid */
.cell { position: absolute; width: 270px; height: 300px; perspective: 1400px }
.card { position: absolute; inset: 0; transform-style: preserve-3d; will-change: transform }
.face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 26px;
  background: linear-gradient(170deg, #f7f8fa, #dfe3e8); display: grid; place-items: center; overflow: hidden;
  box-shadow: 0 24px 50px rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.6) }
.face.back { transform: rotateY(180deg); background: linear-gradient(170deg, #eef0f3, #cfd4db) }
.face svg { width: 88%; height: auto; display: block }
.face .tag { position: absolute; left: 14px; top: 14px; font: 700 17px/1 'Hanken Grotesk'; letter-spacing: .12em; background: #05070a; color: #fff; padding: 8px 11px; border-radius: 99px }

/* scene 4: personalised jersey */
#jwrap { perspective: 2000px; perspective-origin: 500px 960px }
#jglow { position: absolute; left: 0; top: 380px; width: 1000px; height: 1160px; opacity: 0;
  background: radial-gradient(closest-side, rgba(201,242,74,.38), rgba(201,242,74,0)) }
#J { position: absolute; left: 100px; top: 520px; width: 800px; height: 880px; transform-style: preserve-3d; will-change: transform }
.jf { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden }
.jf.back { transform: rotateY(180deg) }
.jf svg { position: absolute; inset: 0; width: 800px; height: 880px; display: block; overflow: visible }
.jbg { position: absolute; inset: -64px -54px; border-radius: 87px; background: linear-gradient(170deg, #f7f8fa, #dfe3e8) }
.jf.back .jbg { background: linear-gradient(170deg, #eef0f3, #cfd4db) }
#ring { position: absolute; left: 50%; top: 53.2%; width: 10px; height: 10px; border-radius: 50%; border: 12px solid var(--volt);
  transform: translate(-50%, -50%); opacity: 0; box-shadow: 0 0 40px rgba(201,242,74,.8), inset 0 0 40px rgba(201,242,74,.6) }

/* scene 5: phone montage */
#phoneWrap { perspective: 2400px; perspective-origin: 500px 1150px }
#phone { position: absolute; left: 190px; top: 520px; width: 620px; height: 1342px; border-radius: 90px; padding: 16px;
  background: linear-gradient(150deg, #39404a, #0c0e12 45%, #232830); transform-style: preserve-3d;
  box-shadow: 0 70px 140px rgba(0,0,0,.7), 0 0 0 3px #4a525d inset, 0 0 140px rgba(201,242,74,.22) }
#screen { position: relative; width: 588px; height: 1310px; border-radius: 74px; overflow: hidden; background: #05070a }
#screen img { position: absolute; left: 0; top: 0; width: 588px; display: block; will-change: transform }
#island { position: absolute; left: 50%; top: 34px; width: 170px; height: 48px; margin-left: -85px; border-radius: 30px; background: #000 }
#sglare { position: absolute; inset: 0; background: linear-gradient(115deg, rgba(255,255,255,0) 35%, rgba(255,255,255,.12) 48%, rgba(255,255,255,0) 60%); }
.orb { position: absolute; width: 170px; height: 170px; will-change: transform; filter: drop-shadow(0 18px 30px rgba(0,0,0,.6)) }

/* scene 6: end card */
#logo { position: absolute; left: 60px; width: 880px; top: 178px; display: flex; align-items: center; justify-content: center; gap: 22px }
#logo img { width: 92px; height: 92px }
#logo span { font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 100px; letter-spacing: -2px; line-height: 1 }
#logo i { font-style: normal; color: var(--volt) }
#date { position: absolute; left: 60px; width: 880px; top: 796px; text-align: center; font-weight: 600; font-size: 62px; letter-spacing: .01em }
#date span { display: inline-block }
#cta { position: absolute; left: 60px; width: 880px; top: 1376px; display: flex; justify-content: center }
#cta .pill { display: inline-flex; align-items: center; gap: .4em; padding: .52em .87em .52em .56em; border-radius: 99px; background: var(--volt); color: #05070a;
  font-weight: 800; font-size: 46px; letter-spacing: -.01em; white-space: nowrap; box-shadow: 0 0 60px rgba(201,242,74,.45), 0 20px 40px rgba(0,0,0,.5) }
#cta .plus { width: 1.26em; height: 1.26em; border-radius: 50%; background: #05070a; color: var(--volt); display: grid; place-items: center; font-size: 1em; font-weight: 700; line-height: 1 }
#ctaRing { position: absolute; inset: 0; border-radius: 99px; border: 5px solid var(--volt); opacity: 0 }
#shine { background: linear-gradient(100deg, rgba(255,255,255,0) 44%, rgba(255,255,255,.9) 50%, rgba(255,255,255,0) 56%);
  -webkit-background-clip: text; background-clip: text; color: transparent; background-size: 300% 100%; background-repeat: no-repeat }

/* preview-only helpers */
#safe { position: absolute; inset: 0; pointer-events: none; display: none; z-index: 50 }
#safe div { position: absolute; background: rgba(255,0,90,.22); outline: 1px dashed #ff3d7f }
#hud { position: fixed; left: 10px; bottom: 10px; z-index: 60; font: 600 12px/1.4 system-ui; color: #8a93a0; display: none }
</style>
</head>

<div id="fit">
<div id="stage">

    <div class="fx" id="dim"></div>

    <!-- 1. HOOK -->

        <span class="ln chk" id="h1b">COUNTRY.</span>
        <span class="ln chk volt glow" id="h1c">YOUR KIT.</span>

<script>/* assets/js/flags.js (from the Kits4U site, unmodified) */
/* Kits4U — procedural national flags.
   Drawn to canvas at any size so the same artwork textures the 3D flag
   footballs, the filter chips and the mini flags on product cards. */
(function () {
  'use strict';
  var K = (window.K4U = window.K4U || {});
  var cache = {};

  function vBands(ctx, w, h, cols) {
    var n = cols.length;
    cols.forEach(function (c, i) {
      ctx.fillStyle = c;
      ctx.fillRect(Math.floor((i * w) / n), 0, Math.ceil(w / n) + 1, h);
    });
  }
  function hBands(ctx, w, h, cols) {
    var n = cols.length;
    cols.forEach(function (c, i) {
      ctx.fillStyle = c;
      ctx.fillRect(0, Math.floor((i * h) / n), w, Math.ceil(h / n) + 1);
    });
  }
  function disc(ctx, x, y, r, c) {
    ctx.fillStyle = c;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }

  var draw = {
    bra: function (ctx, w, h) {
      ctx.fillStyle = '#009c3b';
      ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = '#ffdf00';
      ctx.beginPath();
      ctx.moveTo(w * 0.085, h / 2);
      ctx.lineTo(w / 2, h * 0.12);
      ctx.lineTo(w * 0.915, h / 2);
      ctx.lineTo(w / 2, h * 0.88);
      ctx.closePath();
      ctx.fill();
      var r = Math.min(w * 0.175, h * 0.25), cx = w / 2, cy = h / 2;
      disc(ctx, cx, cy, r, '#002776');
      ctx.save();
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.clip();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = r * 0.17;
      ctx.beginPath();
      ctx.arc(cx - r * 0.35, cy + r * 2.1, r * 2.25, Math.PI * 1.15, Math.PI * 1.95);
      ctx.stroke();
      [[-0.35, 0.35], [0.1, 0.5], [0.4, 0.3], [-0.05, 0.72], [0.55, 0.6], [-0.55, 0.62], [0.25, 0.8]].forEach(function (s) {

      });
      ctx.restore();
    },
    eng: function (ctx, w, h) {
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, w, h);
      var t = Math.min(w, h) * 0.2;
      ctx.fillStyle = '#ce1124';

      ctx.fillRect((w - t) / 2, 0, t, h);

      hBands(ctx, w, h, ['#74acdf', '#ffffff', '#74acdf']);
      var cx = w / 2, cy = h / 2, r = h * 0.075;
      ctx.fillStyle = '#f6b40e';
      for (var i = 0; i < 16; i++) {
        var a = (i / 16) * Math.PI * 2, len = i % 2 ? r * 1.7 : r * 2.05, sp = 0.13;
        ctx.beginPath();
        ctx.moveTo(cx + Math.cos(a - sp) * r * 0.9, cy + Math.sin(a - sp) * r * 0.9);
        ctx.lineTo(cx + Math.cos(a) * len, cy + Math.sin(a) * len);
        ctx.lineTo(cx + Math.cos(a + sp) * r * 0.9, cy + Math.sin(a + sp) * r * 0.9);
        ctx.fill();
      }
      disc(ctx, cx, cy, r, '#f6b40e');
      disc(ctx, cx, cy, r * 0.72, '#f8c43a');
    },
    ita: function (ctx, w, h) { vBands(ctx, w, h, ['#009246', '#ffffff', '#ce2b37']); },
    jpn: function (ctx, w, h) {
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, w, h);
      disc(ctx, w / 2, h / 2, h * 0.3, '#bc002d');
    },
    nga: function (ctx, w, h) { vBands(ctx, w, h, ['#008751', '#ffffff', '#008751']); },
    fra: function (ctx, w, h) { vBands(ctx, w, h, ['#0055a4', '#ffffff', '#ef4135']); },
    ger: function (ctx, w, h) { hBands(ctx, w, h, ['#000000', '#dd0000', '#ffce00']); }
  };

  K.drawFlag = function (ctx, code, w, h) {
    ctx.save();
    (draw[code] || draw.eng)(ctx, w, h);
    ctx.restore();
  };

  K.flagCanvas = function (code, w, h) {
    var key = code + ':' + w + 'x' + h;
    if (cache[key]) return cache[key];
    var c = document.createElement('canvas');
    c.width = w;
    c.height = h;
    K.drawFlag(c.getContext('2d'), code, w, h);
    return (cache[key] = c);
  };

  var urls = {};
  K.flagURL = function (code, w, h) {
    w = w || 60; h = h || 40;
    var key = code + ':' + w + 'x' + h;
    return urls[key] || (urls[key] = K.flagCanvas(code, w, h).toDataURL('image/png'));
  };
})();

    return 'M160 36 ' + neck + ' L 298 50 L 374 112 L 342 170 L 308 150 L 306 410 Q 200 424 94 410 L 92 150 L 58 170 L 26 112 L 102 50 Z';
  }

  var SLEEVE_L = 'M104 49 L26 112 L58 170 L92 150 Q 98 96 104 49 Z';

  var CUFF_L = 'M26 112 L58 170 L67.6 164.7 L35.6 106.7 Z';

<script>/* assets/js/gl.js (from the Kits4U site, unmodified) */
/* Kits4U — 3D engine (raw WebGL, no libraries).

   K4U.Scene(canvas)  full-bleed "Global Kit Vault": floodlit digital stadium,
                      perspective turf with pitch lines + a giant flag football
                      rising over the horizon. Drag to spin it.
   K4U.Orb(canvas)    a small transparent flag football (hero side slots, nation
                      tiles, collection header). All orbs share ONE WebGL
                      context and are blitted into their own 2D canvases, so
                      the page never approaches the browser's context limit.

   uniform change + synchronous redraw, so a swap lands in the same frame. */
(function () {
  'use strict';

  /* ---- football panel centres: 12 pentagons (icosahedron vertices) +

  var CENTRES = (function () {
    var t = (1 + Math.sqrt(5)) / 2, it = 1 / t, v = [], out = [], s = [-1, 1];
    v.push([0, 1, t], [0, -1, t], [0, 1, -t], [0, -1, -t], [1, t, 0], [-1, t, 0],

    s.forEach(function (x) { s.forEach(function (y) { s.forEach(function (z) { v.push([x, y, z]); }); }); });
    s.forEach(function (a) { s.forEach(function (b) { v.push([0, a * t, b * it], [a * it, 0, b * t], [a * t, b * it, 0]); }); });

  var HEAD = [
    '#ifdef GL_FRAGMENT_PRECISION_HIGH',
    'precision highp float;',
    '#else',
    'precision mediump float;',
    '#endif'
  ].join('\n');

  var VERT = 'attribute vec2 aPos; varying vec2 vP; void main(){ vP = aPos; gl_Position = vec4(aPos, 0.0, 1.0); }';

  var BALL = [
    'uniform vec3 uC[32];',
    'uniform sampler2D uTexA;',
    'uniform sampler2D uTexB;',
    'uniform float uMix;',
    'uniform mat3 uRot;',
    'uniform vec3 uRim;',
    'vec4 shadeBall(vec2 p, float aa){',
    '  float r = length(p);',
    '  float z = sqrt(max(0.0, 1.0 - r * r));',
    '  vec3 n = vec3(p, z);',
    '  vec3 o = uRot * n;',
    '  float lon = atan(o.x, o.z);',
    '  float lat = asin(clamp(o.y, -1.0, 1.0));',
    '  vec2 uv = vec2(fract((lon / 6.2831853 + 0.5) * 2.0), 0.5 - lat / 3.1415927);',
    '  vec3 col = mix(texture2D(uTexA, uv).rgb, texture2D(uTexB, uv).rgb, uMix);',
    '  float d1 = -2.0; float d2 = -2.0; float pent = 0.0;',
    '  for (int i = 0; i < 32; i++) {',
    '    float d = dot(o, uC[i]);',
    '    if (d > d1) { d2 = d1; d1 = d; pent = i < 12 ? 1.0 : 0.0; }',
    '    else if (d > d2) { d2 = d; }',
    '  }',
    '  float e = d1 - d2;',
    '  float seam = 1.0 - smoothstep(0.003, 0.012, e);',
    '  float pillow = smoothstep(0.0, 0.09, e);',
    '  col *= mix(0.74, 1.0, pillow);',
    '  col *= mix(1.0, 0.9, pent);',
    '  col = mix(col, vec3(0.05, 0.06, 0.07), seam * 0.9);',
    '  vec3 L = normalize(vec3(-0.5, 0.62, 0.62));',
    '  float dif = max(dot(n, L), 0.0);',
    '  vec3 Hh = normalize(L + vec3(0.0, 0.0, 1.0));',
    '  float spec = pow(max(dot(n, Hh), 0.0), 48.0) * 0.5 * pillow;',
    '  float fres = pow(1.0 - z, 2.5);',
    '  vec3 lit = col * (0.2 + 0.95 * dif) + spec + uRim * fres * 0.55;',
    '  float a = 1.0 - smoothstep(1.0 - aa, 1.0, r);',
    '  return vec4(lit, a);',
    '}'
  ].join('\n');

  var ORB_FRAG = HEAD + '\nvarying vec2 vP;\nuniform float uAA;\n' + BALL + '\n' + [
    'void main(){',
    '  vec2 p = vP / 0.97;',
    '  if (length(p) > 1.0) discard;',
    '  vec4 c = shadeBall(p, uAA);',
    '  gl_FragColor = vec4(c.rgb * c.a, c.a);',
    '}'
  ].join('\n');

  function sceneFrag(deriv) {
    return (deriv ? '#extension GL_OES_standard_derivatives : enable\n#define HAS_DERIV 1\n' : '') + HEAD + '\n' + [
      'varying vec2 vP;',
      'uniform vec2 uRes;',
      'uniform float uTime;',
      'uniform vec3 uBall;',
      'uniform float uHz;',
      'uniform vec3 uTint;',
      'uniform float uAA;',
      BALL,
      'float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }',
      'float aaw(float v){',
      '#ifdef HAS_DERIV',
      '  return fwidth(v);',
      '#else',
      '  return 0.02;',
      '#endif',
      '}',
      'float lineM(float d, float w){ float f = aaw(d) * 1.5 + 1e-4; return 1.0 - smoothstep(w, w + f, abs(d)); }',
      'float gridM(float v, float w){ float f = aaw(v) * 1.5 + 1e-4; return 1.0 - smoothstep(w, w + f, abs(fract(v + 0.5) - 0.5)); }',
      'void main(){',
      '  vec2 fc = gl_FragCoord.xy;',
      '  float H = uRes.y;',
      '  vec2 uv = fc / uRes;',
      '  vec3 col = mix(vec3(0.014, 0.018, 0.026), vec3(0.004, 0.005, 0.008), uv.y);',
      /* floodlights: two pylons in the top corners, beams aimed at the ball */
      '  for (int k = 0; k < 2; k++) {',
      '    float side = k == 0 ? -1.0 : 1.0;',
      '    vec2 lp = vec2(uRes.x * 0.5 + side * max(uRes.x * 0.46, H * 0.5), H * 1.04);',
      '    vec2 d = (fc - lp) / H;',
      '    float dist = length(d);',
      '    col += vec3(0.85, 0.92, 1.0) * 0.22 * exp(-dist * 5.0);',
      '    vec2 tg = (vec2(uBall.x, uHz) - lp) / H;',
      '    float ang = acos(clamp(dot(normalize(d), normalize(tg)), -1.0, 1.0));',
      '    float beam = exp(-ang * ang * 70.0) * (1.0 - smoothstep(0.05, 1.6, dist));',
      '    col += mix(vec3(0.8, 0.9, 1.0), uTint, 0.35) * beam * 0.075;',
      '  }',
      '  float hd = (fc.y - uHz) / H;',
      /* stands: camera flashes twinkling above the horizon */
      '  if (hd > 0.0 && hd < 0.16) {',
      '    vec2 cell = floor(fc / (3.0 * uAA));',
      '    float h = hash(cell);',
      '    float tw = 0.5 + 0.5 * sin(uTime * (1.5 + h * 4.0) + h * 40.0);',
      '    float band = (1.0 - smoothstep(0.02, 0.16, hd)) * smoothstep(0.0, 0.01, hd);',
      '    col += step(0.9965, h) * tw * band * 0.55;',
      '    col += vec3(0.02, 0.025, 0.035) * band;',
      '  }',
      '  col += uTint * 0.13 * exp(-abs(hd) * 13.0);',
      '  col += vec3(0.75, 0.85, 1.0) * 0.05 * exp(-abs(hd) * 45.0);',
      /* turf floor */
      '  if (hd < 0.0) {',
      '    float dy = -hd;',
      '    float z = 0.9 / dy;',
      '    float x = (fc.x - uBall.x) / H * z;',
      '    float s = step(0.5, fract(z / 3.0));',
      '    vec3 turf = mix(vec3(0.016, 0.046, 0.026), vec3(0.024, 0.064, 0.036), s);',
      '    float zc = 11.0;',
      '    float ln = lineM(z - zc, 0.07);',
      '    ln = max(ln, lineM(length(vec2(x, (z - zc))) - 5.0, 0.07));',
      '    ln = max(ln, lineM(abs(x) - 22.0, 0.07));',
      '    float gr = max(gridM(x / 2.0, 0.012), gridM(z / 2.0, 0.012));',
      '    float scan = exp(-pow(fract(z / 24.0 - uTime * 0.05) - 0.5, 2.0) * 900.0);',
      '    float fog = exp(-z * 0.03);',
      '    vec3 fl = turf + vec3(0.9) * ln * 0.22 + vec3(0.55, 1.0, 0.75) * gr * 0.05 + uTint * scan * 0.05;',
      '    fl += uTint * 0.06 * exp(-length(vec2(x, z - zc)) * 0.12);',
      '    col = mix(col, fl, fog);',
      '  }',
      /* the ball */
      '  vec2 bp = (fc - uBall.xy) / uBall.z;',
      '  float br = length(bp);',
      '  if (br > 1.0) {',
      '    col += uRim * 0.24 * exp(-(br - 1.0) * 7.0);',
      '    if (hd < 0.0) col *= 1.0 - 0.45 * exp(-(br - 1.0) * 5.0);',
      '  } else {',
      '    vec4 b = shadeBall(bp, uAA / uBall.z * 1.5);',
      '    col = mix(col, b.rgb, b.a);',
      '  }',
      '  float vg = length((uv - vec2(0.5, 0.45)) * vec2(uRes.x / H, 1.0));',
      '  col *= mix(1.0, 0.55, smoothstep(0.45, 1.25, vg));',
      '  col += (hash(fc + fract(uTime) * 91.0) - 0.5) / 255.0;',
      '  gl_FragColor = vec4(col, 1.0);',
      '}'
    ].join('\n');
  }

  /* ---- tiny GL helpers ---- */
  function compile(gl, type, src) {

    gl.compileShader(sh);

    gl.attachShader(p, compile(gl, gl.FRAGMENT_SHADER, fs));
    gl.bindAttribLocation(p, 0, 'aPos');
    gl.linkProgram(p);

  function textures(gl) {

    return function (code) {
      if (map[code]) return map[code];

      gl.bindTexture(gl.TEXTURE_2D, t);
      gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
      gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, K.flagCanvas(code, 512, 512));
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

  function getGL(canvas, opts) {

    } catch (e) { return null; }
  }
  // o = Ry(spin) * Rx(tilt) * n, column-major for uniformMatrix3fv
  function rotation(spin, tilt) {
    var cy = Math.cos(spin), sy = Math.sin(spin), cx = Math.cos(tilt), sx = Math.sin(tilt);
    return new Float32Array([cy, 0, -sy, sy * sx, cx, cy * sx, sy * cx, -sx, cy * cx]);
  }
  function hexRGB(h) {
    var n = parseInt(h.slice(1), 16);
    return [((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255];
  }
  function lerp3(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }
  function ease(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }

  /* ---- 2D fallback when WebGL is unavailable ---- */
  function drawBall2D(ctx, code, cx, cy, r, spin) {
    var flag = K.flagCanvas(code, 512, 512);
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.clip();
    var w = r * 2, off = (((spin / Math.PI) % 1) + 1) % 1 * w;
    for (var i = -1; i <= 1; i++) ctx.drawImage(flag, cx - r - off + i * w, cy - r, w, w);

    g.addColorStop(0, 'rgba(255,255,255,.28)');
    g.addColorStop(0.55, 'rgba(0,0,0,0)');
    g.addColorStop(1, 'rgba(0,0,0,.55)');
    ctx.fillStyle = g;
    ctx.fillRect(cx - r, cy - r, w, w);
    ctx.restore();
  }

  /* ---- shared frame ticker (pauses when the tab is hidden) ---- */
  var jobs = [], raf = 0, last = 0;
  function frame(t) {
    raf = 0;
    var dt = last ? Math.min((t - last) / 1000, 0.05) : 0.016;
    last = t;
    var busy = false;
    for (var i = 0; i < jobs.length; i++) if (jobs[i](dt, t / 1000)) busy = true;
    if (busy && !document.hidden) raf = requestAnimationFrame(frame);
    else last = 0;
  }
  K.tick = function () { if (!raf && !document.hidden) raf = requestAnimationFrame(frame); };
  document.addEventListener('visibilitychange', K.tick);

  /* =====================================================================
     Scene
     ===================================================================== */
  function Scene(canvas, code) {
    this.canvas = canvas;
    this.code = code;
    this.from = code;
    this.mix = 1;
    this.tint = hexRGB(K.countries[code].tint);
    this.tintFrom = this.tint;
    this.tintT = 1;
    this.spin = 0.6;
    this.tilt = 0.28;
    this.vel = 0;
    this.time = 0;
    this.visible = true;
    this.dirty = true;
    this.layout = { cx: 0, cy: 0, r: 0, hz: 0 };

    var gl = getGL(canvas, { alpha: false, antialias: false, depth: false, stencil: false, powerPreference: 'high-performance' });
    if (gl) {
      try {
        var deriv = !!gl.getExtension('OES_standard_derivatives');
        this.prog = program(gl, sceneFrag(deriv));
        quad(gl);
        this.tex = textures(gl);
        this.gl = gl;
      } catch (e) {
        if (window.console) console.warn('Kits4U: WebGL scene unavailable, using 2D fallback.', e);
        this.gl = null;
      }
    }
    if (!this.gl) this.ctx = canvas.getContext('2d');

    var self = this;
    this.resize();
    window.addEventListener('resize', function () { self.resize(); self.dirty = true; K.tick(); });
    if ('IntersectionObserver' in window) {
      new IntersectionObserver(function (es) { self.visible = es[0].isIntersecting; if (self.visible) K.tick(); }).observe(canvas);
    }
    this.bindDrag();
    jobs.push(function (dt, t) { return self.step(dt, t); });
    K.tick();
  }

  Scene.prototype.resize = function () {
    var c = this.canvas, w = c.clientWidth || innerWidth, h = c.clientHeight || innerHeight;
    var dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    if (w * h * dpr * dpr > 2600000) dpr = Math.sqrt(2600000 / (w * h));
    c.width = Math.round(w * dpr);
    c.height = Math.round(h * dpr);
    this.dpr = dpr;
    // ball: a giant match ball rising over the stadium horizon
    var W = c.width, H = c.height, landscape = W > H;
    var r = landscape ? Math.min(H * 0.37, W * 0.3) : Math.min(W * 0.6, H * 0.3);
    this.layout = { cx: W / 2, cy: -r * 0.08, r: r, hz: -r * 0.08 + r * 0.78 };
  };

  Scene.prototype.set = function (code, instant) {
    if (!K.countries[code]) return;
    if (instant || code === this.code) {
      this.code = this.from = code;
      this.mix = 1;
      this.tint = this.tintFrom = hexRGB(K.countries[code].tint);
      this.tintT = 1;
    } else {
      this.from = this.mix < 0.5 ? this.from : this.code;
      this.code = code;
      this.mix = 0;
      this.tintFrom = this.currentTint();
      this.tint = hexRGB(K.countries[code].tint);
      this.tintT = 0;
    }
    this.dirty = true;
    K.tick();
  };
  Scene.prototype.currentTint = function () { return lerp3(this.tintFrom, this.tint, ease(this.tintT)); };

  Scene.prototype.bindDrag = function () {
    var self = this, c = this.canvas, down = null, lastX = 0, lastY = 0, lastT = 0;
    function onBall(e) {
      var rect = c.getBoundingClientRect(), L = self.layout, d = self.dpr;
      var x = (e.clientX - rect.left) * d, y = (rect.height - (e.clientY - rect.top)) * d;
      return Math.hypot(x - L.cx, y - L.cy) < L.r * 1.05;
    }
    c.addEventListener('pointerdown', function (e) {
      if (!onBall(e)) return;
      down = e.pointerId;
      lastX = e.clientX; lastY = e.clientY; lastT = performance.now();
      self.vel = 0;
      c.classList.add('is-dragging');
      try { c.setPointerCapture(e.pointerId); } catch (_) {}
    });
    c.addEventListener('pointermove', function (e) {
      if (down === null) { c.classList.toggle('is-grab', onBall(e)); return; }
      var now = performance.now(), dx = e.clientX - lastX, dy = e.clientY - lastY;
      var k = 2.2 / Math.max(120, self.layout.r / self.dpr);
      self.spin -= dx * k;
      self.tilt = Math.max(-0.9, Math.min(0.9, self.tilt - dy * k));
      self.vel = (-dx * k) / Math.max(0.008, (now - lastT) / 1000);
      lastX = e.clientX; lastY = e.clientY; lastT = now;
      self.dirty = true;
      K.tick();
    });
    function up() {
      if (down === null) return;
      down = null;
      c.classList.remove('is-dragging');
      self.vel = Math.max(-8, Math.min(8, self.vel));
      K.tick();
    }
    c.addEventListener('pointerup', up);
    c.addEventListener('pointercancel', up);
    c.addEventListener('pointerleave', function () { c.classList.remove('is-grab'); });
  };

  Scene.prototype.step = function (dt, t) {
    var moving = false;
    if (Math.abs(this.vel) > 0.01) {
      this.spin += this.vel * dt;
      this.vel *= Math.pow(0.04, dt);
      moving = true;

  }

  /* ---------------- scene 4: personalised jersey ---------------- */
  var J = $('J'), jglow = $('jglow'), ring = $('ring'), jfront = J.children[0], jback = J.children[1];
  var nameEl, numEl, cursor, typed = -1, s4title;
  function buildJersey() {
    var kit = K.kitById('bra-home');
    jfront.insertAdjacentHTML('beforeend', K.jerseySVG(kit, { view: 'front' }));
    jback.insertAdjacentHTML('beforeend', K.jerseySVG(kit, { view: 'back', name: NAME, number: 10 }));
    var svg = jback.querySelector('svg'), texts = svg.querySelectorAll('text');
    nameEl = texts[1]; numEl = texts[2];
    cursor = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    cursor.setAttribute('width', '5'); cursor.setAttribute('height', '32'); cursor.setAttribute('y', '101'); cursor.setAttribute('rx', '1.5');
    cursor.setAttribute('fill', '#c9f24a');
    svg.appendChild(cursor);
    jback.appendChild(ring);                              // ring above the shirt
  }
  function scene4(t) {
    maskAnim(s4title, t, 11.95);
    // zoom out of the grid: the centre card becomes the hero shirt and flips to its back
    var z = E.inOut(seg(t, 11.3, 11.95));
    var sc = lerp(0.2975, 1, z), tx = 0, ty = lerp(20, 0, z), ry = 720 + 180 * z;
    var push = 0.05 * seg(t, 12, 16), wind = 0.045 * E.inQuad(seg(t, 13.72, STAMP)) * (t < STAMP ? 1 : 0);
    var hit = t >= STAMP ? 0.05 * Math.exp(-(t - STAMP) * 10) : 0;
    var sway = 7 * Math.sin((t - 14.4) * 2.4) * seg(t, 14.3, 14.8);
    css(J, { transform: 'translate(' + tx + 'px,' + ty.toFixed(1) + 'px) scale(' + (sc + push + wind - hit).toFixed(4) + ') rotateY(' + (ry + sway).toFixed(2) + 'deg)' });
    var bgo = (1 - z).toFixed(3);
    J.querySelectorAll('.jbg').forEach(function (b) { b.style.opacity = bgo; });
    // name types itself on
    var n = t < TYPE0 ? 0 : Math.min(NAME.length, Math.floor((t - TYPE0) / TYPE_DT) + 1);
    if (n !== typed) { typed = n; nameEl.textContent = NAME.slice(0, n); }
    var len = n ? nameEl.getComputedTextLength() : 0;
    cursor.setAttribute('x', (200 + len / 2 + 5).toFixed(1));
    var blinkOn = (t - 12) % 0.5 < 0.3 || (t >= TYPE0 && t < TYPE0 + NAME.length * TYPE_DT + 0.1);
    cursor.style.opacity = t > 12.1 && t < 13.75 && blinkOn ? 1 : 0;
    // number 10 stamps in
    var sp = seg(t, STAMP - 0.13, STAMP);
    var ns = t < STAMP ? lerp(3.4, 1, E.inCubic(sp)) : 1 + 0.06 * Math.exp(-(t - STAMP) * 12) * Math.cos((t - STAMP) * 38);
    numEl.setAttribute('transform', 'translate(200 236) scale(' + ns.toFixed(4) + ') translate(-200 -236)');
    numEl.style.opacity = t < STAMP - 0.13 ? 0 : Math.min(1, sp * 2.5);
    var rp = seg(t, STAMP, STAMP + 0.5);
    css(ring, { opacity: (t >= STAMP ? 1 - rp : 0).toFixed(3), width: lerp(140, 980, E.outCubic(rp)).toFixed(1) + 'px', height: lerp(140, 980, E.outCubic(rp)).toFixed(1) + 'px', borderWidth: lerp(18, 2, rp).toFixed(1) + 'px' });
    jglow.style.opacity = (seg(t, 12.0, 12.6) * 0.5 + (t >= STAMP ? 0.6 * Math.exp(-(t - STAMP) * 2.5) : 0)).toFixed(3);
  }

  /* ---------------- scene 5: website montage ---------------- */
  var phone = $('phone'), imHero = $('imHero'), imHome = $('imHome'), imCol = $('imCol'), sglare = $('sglare');
  var S = 588 / 780, SCREEN_H = 1310, HOME_MAX = 3280 * S - SCREEN_H;
  var orbs = [], s5a, s5b;
  // where each nation's orb sits in the home screenshot (image px), and where it flies to
  var ORB_X = [201, 576], ORB_Y = [1730, 2110, 2490, 2870];
  function buildOrbs() {
    K.ORDER.forEach(function (code, i) {
      var c = document.createElement('canvas');
      c.className = 'orb';
      $('orbs').appendChild(c);
      var col = i % 2, row = Math.floor(i / 2);
      var sx = 206 + ORB_X[col] * S, sy = 536 + ORB_Y[row] * S - HOME_MAX;
      orbs.push({ el: c, orb: new K.Orb(c, code, { speed: 0, spin: i, tilt: 0.3, fade: 0 }),
        sx: sx, sy: sy, dx: col ? 892 : 108, dy: 690 + row * 262, i: i });
    });
  }
  function scene5(t) {
    maskAnim(s5a, t, 16.05, 17.85);
    maskAnim(s5b, t, 18.0, 19.78);
    // phone tilt + exit zoom
    var ex = E.inCubic(seg(t, 19.78, 20.0));
    var rx = 7 + 3 * Math.sin(t * 1.3), ry = -9 + 7 * Math.sin(t * 0.9 + 1), rz = -2 + 1.5 * Math.sin(t * 1.1);
    var punch = 0.025 * (Math.exp(-Math.max(0, t - 17.3) * 10) * (t >= 17.3) + Math.exp(-Math.max(0, t - 18.6) * 10) * (t >= 18.6));
    css(phone, { transform: 'rotateX(' + rx.toFixed(2) + 'deg) rotateY(' + ry.toFixed(2) + 'deg) rotateZ(' + rz.toFixed(2) + 'deg) scale(' + (1 + punch + ex * 0.9).toFixed(4) + ')',
      opacity: (1 - ex).toFixed(3), filter: ex ? 'blur(' + (ex * 20).toFixed(1) + 'px)' : 'none' });
    // screen: hero -> scroll whip to featured kits + nations -> swipe to collections
    var up = E.inOut(seg(t, 17.15, 17.35));
    var scroll = HOME_MAX * E.inOut(seg(t, 17.35, 17.95));
    var sw = E.inOut(seg(t, 18.6, 18.8));
    var colScroll = 900 * E.inOut(seg(t, 18.85, 19.85));
    css(imHero, { transform: 'translateY(' + (-up * SCREEN_H).toFixed(1) + 'px) scale(' + (1 + 0.05 * seg(t, 16, 17.15)).toFixed(4) + ')', display: up < 1 ? 'block' : 'none' });
    css(imHome, { transform: 'translate(' + (-sw * 588).toFixed(1) + 'px,' + ((1 - up) * SCREEN_H - scroll).toFixed(1) + 'px)', display: up > 0 && sw < 1 ? 'block' : 'none' });
    css(imCol, { transform: 'translate(' + ((1 - sw) * 588).toFixed(1) + 'px,' + (-colScroll).toFixed(1) + 'px)', display: sw > 0 ? 'block' : 'none' });
    var blur = Math.max(Math.sin(Math.PI * up), Math.sin(Math.PI * sw), Math.sin(Math.PI * seg(t, 17.35, 17.95)) * 0.6);
    $('screen').style.filter = blur > 0.02 ? 'blur(' + (blur * 6).toFixed(1) + 'px)' : 'none';
    sglare.style.transform = 'translateX(' + (Math.sin(t * 0.8) * 160).toFixed(1) + 'px)';
    // the nation orbs burst out of the website's nation grid
    orbs.forEach(function (o) {
      var a = 18.0 + o.i * 0.035, p = E.outBack(seg(t, a, a + 0.42)), q = E.inBack(seg(t, 19.32 + o.i * 0.03, 19.6 + o.i * 0.03));
      var vis = t >= a && q < 1;
      show(o.el, vis);
      if (!vis) return;
      var x = lerp(o.sx, o.dx, p), y = lerp(o.sy, o.dy, p) + 10 * Math.sin(t * 2.6 + o.i) * seg(t, a + 0.4, a + 0.7);
      var sc = lerp(104 / 170, 1, clamp(p, 0, 1.2)) * (1 - q);
      css(o.el, { transform: 'translate(' + (x - 85).toFixed(1) + 'px,' + (y - 85).toFixed(1) + 'px) scale(' + sc.toFixed(4) + ')' });
      o.orb.spin = t * 1.8 + o.i * 0.8 + 3 * E.outCubic(seg(t, a, a + 0.5));
      o.orb.draw();
    });
  }

  /* ---------------- scene 6: end card ---------------- */
  var logo = $('logo'), e1 = $('e1'), e2 = $('e2'), shine = $('shine'), dateIn = $('dateIn'), cta = $('cta'), ctaRing = $('ctaRing');
  function scene6(t) {
    var lp = seg(t, 20.1, 20.42);
    css(logo, { opacity: Math.min(1, lp * 3).toFixed(3), transform: 'scale(' + lerp(0.6, 1, E.outBack(lp)).toFixed(4) + ')' });
    var p1 = seg(t, 20.38, 20.58);
    css(e1, { opacity: Math.min(1, p1 * 2.5).toFixed(3), transform: 'translateY(' + ((1 - E.outExpo(p1)) * 70).toFixed(1) + 'px)', filter: 'blur(' + ((1 - E.outExpo(p1)) * 14).toFixed(1) + 'px)' });
    var p2 = seg(t, 20.69, 20.82);
    var s2 = t < 20.82 ? lerp(1.1, 1, E.inCubic(p2)) : 1 + 0.04 * Math.exp(-(t - 20.82) * 12) * Math.cos((t - 20.82) * 40);
    var breathe = 1 + 0.012 * Math.sin((t - 21) * 3.2) * seg(t, 21, 21.5);
    css(e2, { opacity: Math.min(1, p2 * 3).toFixed(3), transform: 'scale(' + (s2 * breathe).toFixed(4) + ')' });
    var gl = seg(t, 23.15, 23.75);
    shine.style.opacity = gl > 0 && gl < 1 ? 1 : 0;
    shine.style.backgroundPosition = lerp(100, 0, gl).toFixed(1) + '% 0';
    var dp = seg(t, 21.3, 21.75);
    css(dateIn, { clipPath: 'inset(-20% ' + ((1 - E.outCubic(dp)) * 100).toFixed(2) + '% -20% 0)', opacity: dp > 0 ? 1 : 0 });
    var cp = seg(t, 21.9, 22.3), pulse = 0;
    [22.9, 23.9].forEach(function (pt) { var x = seg(t, pt, pt + 0.55); if (x > 0 && x < 1) pulse = Math.max(pulse, Math.sin(Math.PI * Math.min(1, x * 2))); });
    css(cta, { opacity: Math.min(1, cp * 3).toFixed(3), transform: 'translateY(' + ((1 - E.outBack(cp)) * 50).toFixed(1) + 'px) scale(' + (lerp(0.7, 1, E.outBack(cp)) * (1 + 0.045 * pulse)).toFixed(4) + ')' });
    var rr = 0, ro = 0;
    [22.9, 23.9].forEach(function (pt) { var x = seg(t, pt, pt + 0.6); if (x > 0 && x < 1) { rr = x; ro = 1 - x; } });
    css(ctaRing, { opacity: ro.toFixed(3), transform: 'scale(' + (1 + rr * 0.18).toFixed(4) + ',' + (1 + rr * 0.5).toFixed(4) + ')' });
  }

  /* ---------------- frame ---------------- */
  var layers = { s1: $('s1'), s2: $('s2'), s3: $('s3'), s4: $('s4'), s5: $('s5'), s6: $('s6') };
  var cam = $('cam'), dim = $('dim'), black = $('black'), fW = $('flashW'), fV = $('flashV'), fT = $('flashT');
  var now = 0;
  function renderAt(t) {
    t = clamp(t, 0, DURATION - 1e-6);
    now = t;
    poseScene(t);
    var a = t < T.s2, b = t >= T.s2 && t < T.s3, c = t >= T.s3 && t < 11.95, d = t >= 11.3 && t < T.s5, e = t >= T.s5 && t < T.s6, f = t >= T.s6;
    show(layers.s1, a); show(layers.s2, b); show(layers.s3, c); show(layers.s4, d); show(layers.s5, e); show(layers.s6, f);
    if (a) scene1(t);
    if (b) scene2(t);
    if (c) scene3(t);
    if (d) scene4(t);
    if (e) scene5(t);
    if (f) scene6(t);
    var fx = camFX(t);
    css(cam, { transform: 'translate(' + fx.x.toFixed(2) + 'px,' + fx.y.toFixed(2) + 'px) rotate(' + fx.r.toFixed(3) + 'deg) scale(' + (1 + fx.z).toFixed(4) + ')',
      filter: fx.blur > 0.5 ? 'blur(' + fx.blur.toFixed(1) + 'px)' : 'none' });
    dim.style.opacity = (t >= T.s3 && t < T.s6 ? 0.55 : 0).toFixed(3);
    // hook opens on black; the stadium floodlights hit as the ball lands
    black.style.opacity = (t < 0.55 ? 1 - 0.8 * E.inQuad(seg(t, 0.12, 0.55)) : 0.2 * (1 - seg(t, 0.55, 0.65))).toFixed(3);
    fW.style.opacity = flash(t, 'W').toFixed(3);
    fV.style.opacity = flash(t, 'V').toFixed(3);
    var ft = flash(t, 'T');
    fT.style.opacity = ft.toFixed(3);
    if (ft > 0) fT.style.background = 'radial-gradient(80% 50% at 50% 45%, ' + rgba(nationAt(t).tint, 0.9) + ', ' + rgba(nationAt(t).tint, 0) + ')';
  }

  /* ---------------- safe-zone audit (used by the recorder) ---------------- */
  function opacityOf(el) {
    var o = 1;
    for (; el && el.nodeType === 1; el = el.parentElement) {
      var cs = getComputedStyle(el);
      if (cs.display === 'none' || cs.visibility === 'hidden') return 0;
      o *= +cs.opacity;
    }
    return o;
  }
  // Layout is checked against the safe zone with camera shake/whips removed;
  // overflow past the frame edge is checked as rendered.
  function audit() {
    var out = [], keep = cam.style.transform;
    collect(out, true);
    cam.style.transform = 'none';
    collect(out, false);
    cam.style.transform = keep;
    return out;
  }
  function collect(out, asRendered) {
    document.querySelectorAll('.chk').forEach(function (el) {
      var o = opacityOf(el);
      if (o < 0.05) return;
      var r = el.getBoundingClientRect(), fit = $('fit').getBoundingClientRect(), k = fit.width / W;
      var box = { l: (r.left - fit.left) / k, r: (r.right - fit.left) / k, t: (r.top - fit.top) / k, b: (r.bottom - fit.top) / k };
      if (box.r - box.l < 2) return;
      var off = box.l < 0 || box.r > W || box.t < 0 || box.b > H;
      var unsafe = box.l < SAFE.l - 1 || box.r > SAFE.r + 1 || box.t < SAFE.t - 1 || box.b > SAFE.b + 1;
      if (asRendered ? off : unsafe) out.push({ id: el.id || el.textContent.trim().slice(0, 24), opacity: +o.toFixed(2), problem: asRendered ? 'off-frame' : 'outside safe zone', box: [box.l, box.t, box.r, box.b].map(Math.round) });
    });
  }

  /* ---------------- boot ---------------- */
  function boot() {
    scene = new K.Scene(canvas, 'eng');
    buildGrid();
    buildJersey();
    s3title = stackLines(layers.s3.querySelector('.stack'));
    s4title = stackLines(layers.s4.querySelector('.stack'));
    s5a = stackLines($('s5a')); s5b = stackLines($('s5b'));
    // fit every headline into the 860px safe width (layers must be visible to measure)
    Object.keys(layers).forEach(function (k) { layers[k].style.display = 'block'; });
    h1.forEach(function (el) { fitLine(el, 196, 800); });   // 800 x 1.07 slam stays in the safe zone
    s3title.concat(s4title).concat(s5a).concat(s5b).forEach(function (el) { fitLine(el, 116, 860); });
    fitLine(e1, 132, 860); fitLine(e2, 330, 770);
    fitLine(cta.firstChild, 46, 790);
    K.ORDER.forEach(function (code) {
      s2name.textContent = K.countries[code].name.toUpperCase();
      s2size[code] = fitLine(s2name, 230, 800);
    });
    buildOrbs();
    Object.keys(layers).forEach(function (k) { layers[k].style.display = 'none'; });
    window.renderAt = renderAt;
    window.adAudit = audit;
    window.AD = { W: W, H: H, FPS: FPS, DURATION: DURATION, FRAMES: Math.round(DURATION * FPS) };
    renderAt(0);
    window.adReady = true;
    if (!RECORD) preview();
  }

  function preview() {
    function fit() { $('fit').style.transform = 'translate(-50%, -50%) scale(' + Math.min(innerWidth / W, innerHeight / H) + ')'; }
    fit();
    addEventListener('resize', fit);
    if (params.has('safe')) $('safe').style.display = 'block';
    var hud = $('hud');
    hud.style.display = 'block';
    var frozen = params.has('t'), paused = frozen, t0 = performance.now() - (frozen ? +params.get('t') : 0) * 1000;
    if (frozen) renderAt(+params.get('t'));
    addEventListener('keydown', function (e) {
      if (e.key === ' ') { paused = !paused; t0 = performance.now() - now * 1000; e.preventDefault(); }
      if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { var nt = clamp(now + (e.key === 'ArrowRight' ? 1 : -1), 0, DURATION); t0 = performance.now() - nt * 1000; renderAt(nt); }
      if (e.key === 's' || e.key === 'S') { var sf = $('safe'); sf.style.display = sf.style.display === 'block' ? 'none' : 'block'; }
    });
    (function loop() {
      if (!paused) renderAt(((performance.now() - t0) / 1000) % DURATION);
      hud.textContent = now.toFixed(2) + 's  ·  space pause · ←/→ seek · S safe zone';
      requestAnimationFrame(loop);
    })();
  }

  var families = ['400 10px Prata', '600 10px Poppins', '700 10px Poppins', '500 10px Poppins', '400 10px "Hanken Grotesk"', '800 10px "Hanken Grotesk"'];
  Promise.all(families.map(function (f) { return document.fonts.load(f); })).then(function () { return document.fonts.ready; })
    .then(function () {
      var imgs = Array.prototype.slice.call(document.images);
      return Promise.all(imgs.map(function (im) { return im.decode ? im.decode().catch(function () {}) : null; }));
    }).then(boot);
})();

</script>
